# Wildfire Spread Prediction Pipeline Configuration

data:
  raw_dir: "/Users/himanshupandey/Desktop/wildfire-spread-prediction/data/raw"
  resolution: 64
  feature_names:
    - elevation      # Topography (DEM in meters)
    - pdsi           # Palmer Drought Severity Index
    - NDVI           # Normalized Difference Vegetation Index
    - pr             # Precipitation (mm)
    - sph            # Specific humidity (kg/kg)
    - th             # Wind direction azimuth (degrees 0-360)
    - tmmn           # Minimum daily temperature (K)
    - tmmx           # Maximum daily temperature (K)
    - vs             # Wind velocity (m/s)
    - erc            # Energy Release Component
    - population     # Population density (/km^2)
    - PrevFireMask   # Active fire mask at Day T (binary 0/1)
  target_name: "FireMask" # Active fire mask at Day T+1 (binary 0/1)

training:
  batch_size: 32
  num_workers: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 15
  focal_tversky:
    alpha: 0.3       # Weight for False Positives
    beta: 0.7        # Weight for False Negatives (heavily penalize missed fires)
    gamma: 0.75      # Focusing parameter

metrics:
  operational_threshold: 0.35
  fixed_fpr_target: 0.05
